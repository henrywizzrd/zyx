# Đóng gói app để cài thử (chạy tay: tab Actions -> "Build test apps" -> Run workflow)
#  - Android: file APK cài thẳng lên máy (ký bằng khoá debug, chỉ để thử nghiệm)
#  - iOS: file IPA CHƯA KÝ -> dùng Sideloadly + Apple ID (miễn phí) để ký và cài lên iPhone
# Xong thì tải 2 file ở mục "Artifacts" cuối trang của lần chạy
name: Build test apps

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        # Chỉ build cho chip arm64 (mọi điện thoại Android vài năm gần đây) cho nhanh và nhẹ
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk Zyx.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zyx-android
          path: Zyx.apk

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build (không ký)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Zyx.xcworkspace -scheme Zyx -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Zyx.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200
      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Zyx.xcarchive/Products/Applications/Zyx.app Payload/
          zip -qry Zyx-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Zyx-ios
          path: Zyx-unsigned.ipa
