# Đóng gói app để cài thử. Cách chạy:
#  - push một commit có chữ [build] trong lời nhắn commit (chạy được trên mọi nhánh), hoặc
#  - push một commit có chữ [update]: KHÔNG build lại, chỉ đẩy code JS mới lên Expo (EAS Update) → app đã cài tự cập nhật
#    (cần secret EXPO_TOKEN trong Settings → Secrets and variables → Actions)
#  - tab Actions -> "Build test apps" -> Run workflow (nút này chỉ hiện khi file này đã có trên nhánh main)
#  - Android: file APK cài thẳng lên máy (ký bằng khoá debug, chỉ để thử nghiệm)
#  - iOS: file IPA CHƯA KÝ -> dùng Sideloadly + Apple ID (miễn phí) để ký và cài lên iPhone
# Xong thì tải 2 file ở mục "Artifacts" cuối trang của lần chạy
name: Build test apps

on:
  workflow_dispatch:
  push:

# Push bình thường thì 2 job bên dưới bị bỏ qua (không tốn gì), chỉ build khi lời nhắn commit có [build]

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        # Chỉ build cho chip arm64 (mọi điện thoại Android vài năm gần đây) cho nhanh và nhẹ
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk Zyx.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-android
          path: Zyx.apk

  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build (không ký)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace ios/Zyx.xcworkspace -scheme Zyx -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Zyx.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1 \
            || { echo "=== CÁC DÒNG LỖI ==="; grep -nE "error:|\*\* ARCHIVE FAILED|fatal" xcodebuild.log | head -n 60; echo "=== 80 DÒNG CUỐI ==="; tail -n 80 xcodebuild.log; exit 1; }
      - name: Lưu log build iOS (để xem lỗi)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Zyx.xcarchive/Products/Applications/Zyx.app Payload/
          zip -qry Zyx-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-ios
          path: Zyx-unsigned.ipa

  # Gom 2 file vào một bản Release (trang chính repo -> Releases ở cột phải): tải thẳng, không bị nén zip
  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Zyx test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Bản build thử nghiệm từ nhánh `${{ github.ref_name }}` (commit ${{ github.sha }}).
            - Android: tải `Zyx.apk` rồi cài thẳng lên máy.
            - iPhone: tải `Zyx-unsigned.ipa`, ký và cài bằng Sideloadly (Apple ID miễn phí: dùng được 7 ngày).
          files: |
            out/Zyx.apk
            out/Zyx-unsigned.ipa

  # Cập nhật qua mạng (EAS Update): app đã cài tự tải bản mới, không cần cài lại.
  # Chỉ dùng được cho thay đổi JS / ảnh. Thêm thư viện native, đổi icon, tên app, quyền... thì phải [build] lại
  update:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[update]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đẩy bản cập nhật lên kênh preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: npx --yes eas-cli@latest update --channel preview --message "$MSG" --non-interactive
