# Đóng gói app để cài thử. Cách chạy:
#  - push một commit có chữ [build] trong lời nhắn commit (chạy được trên mọi nhánh), hoặc
#  - tab Actions -> "Build test apps" -> Run workflow (nút này chỉ hiện khi file này đã có trên nhánh main)
#  - Android: file APK cài thẳng lên máy (ký bằng khoá debug, chỉ để thử nghiệm)
#  - iOS: file IPA CHƯA KÝ -> dùng Sideloadly + Apple ID (miễn phí) để ký và cài lên iPhone
# Xong thì tải 2 file ở mục "Artifacts" cuối trang của lần chạy
name: Build test apps

on:
  workflow_dispatch:
  push:

# Push bình thường thì 2 job bên dưới bị bỏ qua (không tốn gì), chỉ build khi lời nhắn commit có [build]

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        # Chỉ build cho chip arm64 (mọi điện thoại Android vài năm gần đây) cho nhanh và nhẹ
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk Zyx.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-android
          path: Zyx.apk

  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios
      - name: Build (không ký)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace ios/Zyx.xcworkspace -scheme Zyx -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Zyx.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1 \
            || { echo "=== CÁC DÒNG LỖI ==="; grep -nE "error:|\*\* ARCHIVE FAILED|fatal" xcodebuild.log | head -n 60; echo "=== 80 DÒNG CUỐI ==="; tail -n 80 xcodebuild.log; exit 1; }
      - name: Lưu log build iOS (để xem lỗi)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Zyx.xcarchive/Products/Applications/Zyx.app Payload/
          zip -qry Zyx-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-ios
          path: Zyx-unsigned.ipa
