# Đóng gói app để cài thử. Cách chạy:
#  - push một commit có chữ [build] trong lời nhắn commit (chạy được trên mọi nhánh), hoặc
#  - push một commit có chữ [update]: KHÔNG build lại, chỉ đẩy code JS mới lên Expo (EAS Update) → app đã cài tự cập nhật
#    (cần secret EXPO_TOKEN trong Settings → Secrets and variables → Actions)
#  - tab Actions -> "Build test apps" -> Run workflow (nút này chỉ hiện khi file này đã có trên nhánh main)
#  - Android: file APK cài thẳng lên máy (ký bằng khoá debug, chỉ để thử nghiệm)
#  - iOS: file IPA CHƯA KÝ -> dùng Sideloadly + Apple ID (miễn phí) để ký và cài lên iPhone
# Xong thì tải 2 file ở mục "Artifacts" cuối trang của lần chạy
#
# BẢN ỔN ĐỊNH cho người dùng (từ v1.1.0): commit có chữ [release] (trên nhánh main) →
#  - build APK + IPA với kênh cập nhật "production" (người dùng KHÔNG nhận các bản [update] thử nghiệm)
#  - tạo Release chính thức "ZYX v<version>" (không phải pre-release, đánh dấu Latest), tag v<version>
#  - đẩy luôn bản JS đó lên kênh production (app ổn định đã cài sẽ tự cập nhật)
#
# BETA app ("ZYX Beta", installs next to the stable app): on the `beta` branch, [build] builds the beta
#  variant (scripts/ci/beta-variant.js) and only uploads the APK/IPA as workflow artifacts — no GitHub Release;
#  [update] pushes the JS to the "beta" channel.
#
# HOTFIX for stable users: a commit containing [hotfix] (on main) only pushes the new JS to the "production" channel
#  (no new build, no new Release) — stable installs pick it up after closing and reopening the app.
#  APK (cả bản thử lẫn bản ổn định) ký bằng khoá riêng của ZYX nếu có secret ANDROID_KEYSTORE_BASE64 (scripts/ci/android-signing.js)
name: Build test apps

on:
  workflow_dispatch:
  push:

# Push bình thường thì 2 job bên dưới bị bỏ qua (không tốn gì), chỉ build khi lời nhắn commit có [build]

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - run: npm ci
      - name: Kênh cập nhật
        if: contains(github.event.head_commit.message, '[release]')
        run: node scripts/ci/set-channel.js production
      - name: ZYX Beta variant
        if: github.ref_name == 'beta'
        run: node scripts/ci/beta-variant.js
      - run: npx expo prebuild --platform android --no-install
      - name: Ký bằng khoá riêng của ZYX
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/ci/android-signing.js
      - name: Build APK
        working-directory: android
        # Sentry: gửi bản đồ mã (source map) lên để báo lỗi chỉ đúng dòng code. Lỗi gửi thì bỏ qua, không làm hỏng bản build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ALLOW_FAILURE: true
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Chỉ build cho chip arm64 (mọi điện thoại Android vài năm gần đây) cho nhanh và nhẹ.
        # Tắt R8 (thu gọn / làm rối mã Java): bản Expo hiện tại bật sẵn nhưng R8 xoá nhầm một hàm của expo-modules
        # → expo-sqlite không nạp được → app văng ngay khi mở ("Cannot find native module 'ExpoSQLite'")
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 -Pandroid.enableMinifyInReleaseBuilds=false --no-daemon
      - run: mv android/app/build/outputs/apk/release/app-release.apk Zyx.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-android
          path: Zyx.apk

  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kênh cập nhật
        if: contains(github.event.head_commit.message, '[release]')
        run: node scripts/ci/set-channel.js production
      - name: ZYX Beta variant
        if: github.ref_name == 'beta'
        run: node scripts/ci/beta-variant.js
      - run: npx expo prebuild --platform ios
      - name: Build (không ký)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ALLOW_FAILURE: true
        run: |
          set -o pipefail
          xcodebuild -version
          # project name follows the app name ("Zyx", or "ZYXBeta" for the beta variant)
          WS=$(ls -d ios/*.xcworkspace | head -n 1); SCHEME=$(basename "$WS" .xcworkspace); echo "workspace $WS · scheme $SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Zyx.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1 \
            || { echo "=== CÁC DÒNG LỖI ==="; grep -nE "error:|\*\* ARCHIVE FAILED|fatal" xcodebuild.log | head -n 60; echo "=== 80 DÒNG CUỐI ==="; tail -n 80 xcodebuild.log; exit 1; }
      - name: Lưu log build iOS (để xem lỗi)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
      - name: Đóng gói IPA
        run: |
          mkdir -p Payload
          cp -R build/Zyx.xcarchive/Products/Applications/*.app Payload/
          zip -qry Zyx-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: Zyx-ios
          path: Zyx-unsigned.ipa

  # Gom 2 file vào một bản Release (trang chính repo -> Releases ở cột phải): tải thẳng, không bị nén zip
  release:
    needs: [android, ios]
    if: github.ref_name != 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      # Dùng gh (có sẵn trên máy build) thay cho action cũ: action đó hay lỗi giữa chừng khi tải nhiều file lên cùng lúc
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Tạo Release chính thức (bản ổn định)
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./src/app.json').expo.version")
          NOTES=src/RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "ZYX v$VER" > notes.md; NOTES=notes.md; }
          gh release create "v$VER" out/Zyx.apk out/Zyx-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ZYX v$VER" --notes-file "$NOTES"
      - name: Tạo Release
        if: ${{ !contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-build-${{ github.run_number }}
        run: |
          gh release create "$TAG" out/Zyx.apk out/Zyx-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Zyx test build ${{ github.run_number }}" \
            --notes "Bản build thử nghiệm từ nhánh \`$GITHUB_REF_NAME\` (commit $GITHUB_SHA).
          - Android: tải \`Zyx.apk\` rồi cài thẳng lên máy.
          - iPhone: tải \`Zyx-unsigned.ipa\`, ký và cài bằng ESign / Sideloadly."

  # ZYX Beta: one rolling pre-release "ZYX Beta" (tag beta-latest), replaced by every beta [build],
  # so the Releases page only ever shows a single beta entry next to the stable releases.
  beta-release:
    needs: [android, ios]
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Replace the "ZYX Beta" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/Zyx.apk out/ZYX-Beta.apk
          mv out/Zyx-unsigned.ipa out/ZYX-Beta-unsigned.ipa
          gh release delete beta-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create beta-latest out/ZYX-Beta.apk out/ZYX-Beta-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "ZYX Beta (build ${{ github.run_number }})" \
            --notes "Beta build ${{ github.run_number }} from the \`beta\` branch (commit $GITHUB_SHA).
          ZYX Beta installs next to the stable app — it does not replace it.
          - Android: download \`ZYX-Beta.apk\` and install.
          - iPhone: download \`ZYX-Beta-unsigned.ipa\` and sign it with ESign / Sideloadly / AltStore."

  # Cập nhật qua mạng (EAS Update): app đã cài tự tải bản mới, không cần cài lại.
  # Chỉ dùng được cho thay đổi JS / ảnh. Thêm thư viện native, đổi icon, tên app, quyền... thì phải [build] lại
  update:
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[update]') || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[hotfix]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ZYX Beta variant
        if: github.ref_name == 'beta'
        run: node scripts/ci/beta-variant.js
      # [hotfix] / [critical] updates ask the user to restart right away; every other update applies quietly on next launch
      - name: Mark critical update
        if: contains(github.event.head_commit.message, '[hotfix]') || contains(github.event.head_commit.message, '[critical]')
        run: node -e "const f='app.json';const j=JSON.parse(require('fs').readFileSync(f));j.expo.extra.updatePriority='critical';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      # Đẩy riêng iOS và Android: để "all" thì nó đóng gói cả bản web (app không dùng web, và expo-sqlite trên web lỗi)
      - name: Push OTA update (preview for [update], production for [release] / [hotfix], beta on the beta branch)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
          CH: ${{ github.ref_name == 'beta' && 'beta' || ((contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[hotfix]')) && 'production' || 'preview') }}
          CI: 1
        run: |
          # Sau mỗi lần đẩy: gửi source map của bản cập nhật lên Sentry (lỗi thì bỏ qua)
          npx --yes eas-cli@latest update --channel "$CH" --platform ios --message "$MSG" --non-interactive
          npx sentry-expo-upload-sourcemaps dist || echo "Sentry: không gửi được source map iOS"
          npx --yes eas-cli@latest update --channel "$CH" --platform android --message "$MSG" --non-interactive
          npx sentry-expo-upload-sourcemaps dist || echo "Sentry: không gửi được source map Android"

  # Kiểm tra giao diện tự động trên máy ảo Android: chỉ chạy khi lời nhắn commit có [check].
  # Lưu ý: máy ảo của GitHub vẽ đồ hoạ bằng CPU (không có GPU) nên app (Skia, kính mờ, hiệu ứng nền) chạy rất chậm,
  # dễ treo giữa chừng — chưa dùng được để đo độ mượt, chỉ để thử luồng bấm cơ bản.
  # Mở app, bấm theo kịch bản .maestro/flow.yaml (mở / đóng player, đổi dock, thu dock, kính lúp, nhật ký),
  # chụp từng bước + quay video + đo khung hình. Kết quả ở Artifacts → "ui-check" (Claude tự tải về xem)
  ui-check:
    needs: [android, update]
    if: >-
      always() && github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[check]') &&
      needs.android.result != 'failure' && needs.update.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # APK: vừa build xong thì dùng bản đó, không thì lấy APK của bản Release mới nhất (+ bản cập nhật OTA mới nhất)
      - uses: actions/download-artifact@v5
        if: needs.android.result == 'success'
        with:
          name: Zyx-android
          path: apk
      - name: Lấy APK của bản Release mới nhất
        if: needs.android.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Zyx.apk --dir apk
      - name: Bật KVM cho máy ảo
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cài Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096 -cores 4
          ram-size: 4096M
          script: bash .maestro/run.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-check
          path: ui-out
      # Đẩy kết quả lên nhánh riêng "ui-check" (ghi đè mỗi lần): Claude đọc được qua git (không tải được Artifacts)
      - name: Đẩy kết quả lên nhánh ui-check
        if: always()
        run: |
          cd ui-out || exit 0
          git init -q -b ui-check
          git config user.name "zyx-ui-check"
          git config user.email "actions@github.com"
          echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID}" > RUN.txt
          git add -A
          git commit -qm "UI check ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-check
